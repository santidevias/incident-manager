<div class="relative w-full mb-4">
  <!-- Etiqueta opcional para mayor accesibilidad -->
  <label [for]="idElement()" class="block text-sm font-medium text-gray-700 mb-1.5">
    {{ labelName() }}
  </label>

  <div class="relative mt-1">
    <select
      [id]="idElement()"
      [formControl]="controlForm()"
      (change)="onSelect($event)"
      class="w-full appearance-none rounded-xl border border-gray-300 bg-white px-4 py-3 pr-10 text-gray-700 shadow-sm transition-all duration-200 ease-in-out focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 focus:outline-none hover:border-gray-400 cursor-pointer sm:text-sm"
    >
      <option value="" class="text-gray-400">Seleccione una opción</option>
      @for (item of items(); track item.id) {
        <option
          [value]="item.id"
          [selected]="defaultValue() === item.id"
          class="text-gray-900 bg-white py-2"
        >
          {{ item.name }}
        </option>
      }
    </select>

    <!-- Flecha personalizada (SVG) -->
    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3.5">
      <svg
        class="h-5 w-5 text-gray-400"
        xmlns="http://w3.org"
        viewBox="0 0 20 20"
        fill="currentColor"
        aria-hidden="true"
      >
        <path
          fill-rule="evenodd"
          d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"
          clip-rule="evenodd"
        />
      </svg>
    </div>
  </div>
</div>
