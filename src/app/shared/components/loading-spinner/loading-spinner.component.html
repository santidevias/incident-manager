<div class="flex flex-col items-center justify-center p-4">
  <!-- Rueda giratoria -->
  <div
    class="animate-spin rounded-full border-solid border-current border-t-transparent"
    [class]="sizeClasses()[size()] || sizeClasses()['md']"
    [style.color]="color()"
  ></div>

  <!-- Texto de carga opcional -->
  @if (loadingText()) {
    <p class="mt-2 text-sm font-medium text-gray-600 animate-pulse">
      {{ loadingText() }}
    </p>
  }
</div>
