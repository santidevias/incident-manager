<div class="fixed top-5 right-5 z-50 flex flex-col gap-3 w-full max-w-sm pointer-events-none">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      [ngClass]="getToastClasses(toast.type)"
      class="flex items-center justify-between p-4 rounded-lg shadow-lg border pointer-events-auto transition-all duration-300 transform translate-y-0 animate-fade-in"
    >
      <span class="text-sm font-medium">{{ toast.message }}</span>
      <button
        (click)="toastService.remove(toast.id)"
        class="ml-4 text-current opacity-70 hover:opacity-100 focus:outline-none"
      >
        ✕
      </button>
    </div>
  }
</div>
