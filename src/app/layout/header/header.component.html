<header
  class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 flex-shrink-0"
>
  <div class="flex items-center space-x-4">
    <!-- Botón de Hamburguesa Móvil -->
    <button
      (click)="toggleMobileMenu()"
      class="text-slate-600 hover:text-slate-900 md:hidden p-1 focus:outline-none"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16"
        />
      </svg>
    </button>
    <h1 class="text-lg font-semibold text-slate-700 hidden sm:block">
      Panel de Control de Incidencias
    </h1>
  </div>

  <div class="text-sm text-slate-500 font-medium">Prueba Técnica Angular 22</div>
</header>
