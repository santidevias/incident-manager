<a
  href="#main-content"
  class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-blue-600 focus:text-white focus:rounded-md focus:shadow-lg focus:outline-none"
>
  Saltar al contenido principal
</a>
<div class="min-h-screen bg-slate-50 text-slate-800 font-sans flex flex-col md:flex-row">
  <app-sidebar
    [isMobileMenuOpen]="isMobileMenuOpen()"
    (toggleMenu)="toggleMobileMenu()"
    (closeMenu)="closeMobileMenu()"
  >
  </app-sidebar>

  <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
    <app-header (toggleMenu)="toggleMobileMenu()"></app-header>

    <main id="main-content" tabindex="-1" class="flex-1 p-6 overflow-y-auto bg-slate-50">
      <div class="max-w-7xl mx-auto">
        <router-outlet></router-outlet>
      </div>
    </main>

    <app-footer></app-footer>
  </div>
</div>
