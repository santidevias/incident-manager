<!-- ========================================================= -->
<!-- 1. SIDEBAR (RESPONSIVE: FLOTANTE EN MÓVIL, FIJO EN PC)  -->
<!-- ========================================================= -->
<aside
  class="fixed inset-y-0 left-0 z-50 w-64 bg-slate-900 text-white p-5 flex flex-col justify-between transform transition-transform duration-300 ease-in-out md:translate-x-0 md:static md:h-screen md:visible"
  [class.translate-x-0]="isMobileMenuOpen()"
  [class.-translate-x-full]="!isMobileMenuOpen()"
>
  <div>
    <!-- Header del Menú -->
    <div class="flex items-center justify-between pb-6 border-b border-slate-800">
      <h2 class="text-xl font-bold tracking-wider text-indigo-400">G/I Técnicas</h2>
      <!-- Botón cerrar (Solo móvil) -->
      <button (click)="toggleMobileMenu()" class="text-slate-400 hover:text-white md:hidden p-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <!-- Enlaces de navegación reactivos al Rol -->
    <nav class="mt-6 space-y-2">
      <!-- Dashboard (Solo Admin) -->
      @if (authService.role() === 'admin') {
        <a
          routerLink="/dashboard"
          routerLinkActive="bg-indigo-600 text-white"
          (click)="closeMobileMenu()"
          tabindex="0"
          class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2v-4zM14 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2v-4z"
            />
          </svg>
          <span class="font-medium">Dashboard</span>
        </a>
      }

      <!-- Incidencias (Todos los roles acceden) -->
      <a
        routerLink="/incidents"
        routerLinkActive="bg-indigo-600 text-white"
        (click)="closeMobileMenu()"
        tabindex="0"
        class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"
          />
        </svg>
        <span class="font-medium">Incidencias</span>
      </a>
    </nav>
  </div>

  <!-- Sección de Usuario e Inicio/Cierre de Sesión -->
  <div class="pt-4 border-t border-slate-800 flex flex-col gap-3">
    <div class="flex items-center space-x-3 px-2">
      <div
        class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center font-bold text-white uppercase"
      >
        {{ authService.roleInitial() }}
      </div>
      <div class="truncate">
        <p class="text-xs text-slate-400 capitalize">Rol: {{ authService.role() }}</p>
      </div>
    </div>
    <button
      (click)="logout()"
      class="w-full flex items-center justify-center space-x-2 bg-slate-800 hover:bg-red-600 hover:text-white text-slate-300 py-2 px-4 rounded-lg transition-colors text-sm font-medium"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
        />
      </svg>
      <span>Cerrar Sesión</span>
    </button>
  </div>
</aside>

<!-- Fondo oscuro difuminado detrás del sidebar flotante (Solo móvil) -->
@if (isMobileMenuOpen()) {
  <div
    (click)="closeMobileMenu()"
    (window:keydown.escape)="closeMobileMenu()"
    role="button"
    tabindex="-1"
    aria-label="Cerrar menú de navegación"
    class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 md:hidden cursor-pointer"
  ></div>
}
